name: Clear MongoDB Data

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to confirm you want to permanently delete all MongoDB data'
        required: true
        type: string

jobs:
  clear-mongodb:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "YES" ]; then
            echo "Confirmation failed. You must type 'YES' to proceed."
            exit 1
          fi

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      # VPS_HOST, VPS_USERNAME and VPS_SSH_KEY live in Doppler (references to shared/prd, the same
      # for every app), so GitHub keeps only DOPPLER_TOKEN. They are masked in the logs.
      - name: Load deploy secrets from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          for name in VPS_HOST VPS_USERNAME VPS_SSH_KEY; do
            value=$(doppler secrets get "$name" --plain)
            if [ -z "$value" ]; then
              echo "::error::$name is empty in Doppler journei/prd."
              exit 1
            fi
            while IFS= read -r line; do
              if [ -n "$line" ]; then echo "::add-mask::$line"; fi
            done <<< "$value"
            { echo "$name<<__DOPPLER_EOF__"; echo "$value"; echo "__DOPPLER_EOF__"; } >> "$GITHUB_ENV"
          done

      # Journei's data lives in the journey-planner database of the shared ecosystem-mongo
      # instance (DAN-90). The journei Mongo user can only touch that database, so this
      # drops every collection in it and leaves the other apps alone.
      - name: Clear the journey-planner database on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/journei

            echo "Dropping every collection in journey-planner..."
            doppler run -- docker run --rm --network ecosystem -e MONGO_PASSWORD mongo:7 sh -c \
              'mongosh --quiet "mongodb://journei:$MONGO_PASSWORD@ecosystem-mongo:27017/journey-planner?authSource=admin" --eval "db.getCollectionNames().forEach((c) => { db.getCollection(c).drop(); print(\"dropped \" + c); })"'

            echo "Restarting the backend so it recreates its indexes..."
            doppler run -- docker compose restart backend

            echo "MongoDB data has been cleared successfully."
