name: Clear MongoDB Data

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to confirm you want to permanently delete all MongoDB data'
        required: true
        type: string

jobs:
  clear-mongodb:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "YES" ]; then
            echo "Confirmation failed. You must type 'YES' to proceed."
            exit 1
          fi

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      # VPS_HOST, VPS_USERNAME and VPS_SSH_KEY live in Doppler (references to shared/prd, the same
      # for every app), so GitHub keeps only DOPPLER_TOKEN. They are masked in the logs.
      - name: Load deploy secrets from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          for name in VPS_HOST VPS_USERNAME VPS_SSH_KEY; do
            value=$(doppler secrets get "$name" --plain)
            if [ -z "$value" ]; then
              echo "::error::$name is empty in Doppler journei/prd."
              exit 1
            fi
            while IFS= read -r line; do
              if [ -n "$line" ]; then echo "::add-mask::$line"; fi
            done <<< "$value"
            { echo "$name<<__DOPPLER_EOF__"; echo "$value"; echo "__DOPPLER_EOF__"; } >> "$GITHUB_ENV"
          done

      - name: Clear MongoDB Volume on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            echo "Navigating to project directory..."
            cd /opt/journei || exit 1

            echo "Stopping MongoDB container..."
            docker compose stop mongodb

            echo "Removing MongoDB container (to release volume)..."
            docker compose rm -f mongodb

            echo "Removing MongoDB volume..."
            # The volume name is prefixed with the compose project name.
            # docker-compose.yml sets the project name to "journei", so the volume is "journei_mongodb_data"
            docker volume rm journei_mongodb_data || echo "Volume might already be deleted or not found."

            echo "Starting MongoDB container fresh..."
            docker compose up -d mongodb

            echo "MongoDB data has been cleared successfully."
