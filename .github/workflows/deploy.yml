name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_type:
        description: 'Deploy using Branch or Commit'
        required: true
        type: choice
        options:
          - branch
          - commit
        default: 'branch'
      branch_name:
        description: 'Branch name (if empty, defaults to main)'
        required: false
        type: string
        default: ''
      commit_hash:
        description: 'Commit hash (if empty, defaults to main)'
        required: false
        type: string
        default: ''

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/journei-frontend
  BACKEND_IMAGE_NAME: ${{ github.repository }}/journei-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      target_ref: ${{ steps.determine-ref.outputs.target_ref }}

    steps:
      - name: Determine Target Reference
        id: determine-ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          INPUT_DEPLOY_TYPE: ${{ inputs.deploy_type }}
          INPUT_BRANCH_NAME: ${{ inputs.branch_name }}
          INPUT_COMMIT_HASH: ${{ inputs.commit_hash }}
        run: |
          TARGET_REF="$GITHUB_SHA"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TARGET_REF="main"
            if [[ "$INPUT_DEPLOY_TYPE" == "branch" ]]; then
              if [[ -n "$INPUT_BRANCH_NAME" ]]; then
                TARGET_REF="$INPUT_BRANCH_NAME"
              fi
            elif [[ "$INPUT_DEPLOY_TYPE" == "commit" ]]; then
              if [[ -n "$INPUT_COMMIT_HASH" ]]; then
                TARGET_REF="$INPUT_COMMIT_HASH"
              fi
            fi
          fi
          echo "target_ref=$TARGET_REF" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.determine-ref.outputs.target_ref }}

      # Build-time keys live in Doppler (project journei, config prd). `doppler secrets get`
      # fails the job if the token or the Clerk key is missing, so a build without sign-in
      # never ships.
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Load build-time keys from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "::error::Set the DOPPLER_TOKEN repository secret (a read-only service token for journei/prd)."
            exit 1
          fi
          # The backend uses the same publishable key, so Doppler keeps one variable and
          # the frontend build gets it under its VITE_ name.
          CLERK_KEY=$(doppler secrets get CLERK_PUBLISHABLE_KEY --plain)
          echo "VITE_CLERK_PUBLISHABLE_KEY=$CLERK_KEY" >> "$GITHUB_ENV"
          # The map is optional: build without it rather than failing.
          MAPS_KEY=$(doppler secrets get VITE_GOOGLE_MAPS_API_KEY --plain 2>/dev/null || true)
          if [ -z "$MAPS_KEY" ]; then
            echo "::warning::VITE_GOOGLE_MAPS_API_KEY is not set in Doppler; maps will not load."
          else
            echo "::add-mask::$MAPS_KEY"
          fi
          echo "VITE_GOOGLE_MAPS_API_KEY=$MAPS_KEY" >> "$GITHUB_ENV"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image names
        run: |
          echo "FRONTEND_IMAGE_LOWER=${{ env.REGISTRY }}/$(echo ${{ env.FRONTEND_IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "BACKEND_IMAGE_LOWER=${{ env.REGISTRY }}/$(echo ${{ env.BACKEND_IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE_LOWER }}:latest
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ env.VITE_CLERK_PUBLISHABLE_KEY }}
            VITE_GOOGLE_MAPS_API_KEY=${{ env.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE_LOWER }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-push.outputs.target_ref }}

      - name: Lowercase Repository Name
        run: |
          echo "GITHUB_REPOSITORY_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      # VPS_HOST, VPS_USERNAME and VPS_SSH_KEY live in Doppler (references to shared/prd, the same
      # for every app), so GitHub keeps only DOPPLER_TOKEN. They are masked in the logs.
      - name: Load deploy secrets from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          for name in VPS_HOST VPS_USERNAME VPS_SSH_KEY; do
            value=$(doppler secrets get "$name" --plain)
            if [ -z "$value" ]; then
              echo "::error::$name is empty in Doppler journei/prd."
              exit 1
            fi
            while IFS= read -r line; do
              if [ -n "$line" ]; then echo "::add-mask::$line"; fi
            done <<< "$value"
            { echo "$name<<__DOPPLER_EOF__"; echo "$value"; echo "__DOPPLER_EOF__"; } >> "$GITHUB_ENV"
          done

      - name: Copy configuration files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ env.VPS_SSH_KEY }}
          source: "docker-compose.yml,nginx/,scripts/backup-db.sh"
          target: "/opt/journei"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ env.VPS_SSH_KEY }}
          envs: GITHUB_REPOSITORY_LOWER
          script: |
            # Ensure the target directory exists
            mkdir -p /opt/journei
            cd /opt/journei

            # Log in to GHCR with the job's GITHUB_TOKEN: it can read this repo's packages and
            # expires when the job ends, so no long-lived registry token is needed.
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Runtime secrets come from Doppler. The VPS user has a read-only service token
            # scoped to /opt/journei (doppler configure set token --scope /opt/journei).
            # Stop here if it is missing, rather than starting a backend without Clerk keys.
            if ! doppler secrets get CLERK_SECRET_KEY --plain > /dev/null; then
              echo "Doppler is not set up for /opt/journei on this VPS user." >&2
              exit 1
            fi

            # The backend uses the shared MongoDB (ecosystem-infra, DAN-90). Stop before changing
            # anything if that stack or this app's Mongo password is missing.
            if ! docker network inspect ecosystem > /dev/null 2>&1; then
              echo "Network 'ecosystem' is missing: deploy the shared Mongo stack (ecosystem-infra) first." >&2
              exit 1
            fi
            if [ -z "$(doppler secrets get MONGO_PASSWORD --plain)" ]; then
              echo "MONGO_PASSWORD is missing in Doppler journei/prd." >&2
              exit 1
            fi

            # Clean up dangling images before pulling new ones to free up space
            docker image prune -f

            # Pull the latest images
            docker pull ghcr.io/$GITHUB_REPOSITORY_LOWER/journei-frontend:latest
            docker pull ghcr.io/$GITHUB_REPOSITORY_LOWER/journei-backend:latest

            # Update Nginx config with DOMAIN
            DOMAIN_VALUE=$(doppler secrets get DOMAIN --plain)
            sed -i "s/server_name _;/server_name ${DOMAIN_VALUE};/g" nginx/nginx.conf

            # One-time dump before the backend that moves plans to Clerk ids and drops the old
            # users collection (DAN-93). No-op once backups/pre-dan-93.archive exists.
            doppler run -- bash scripts/backup-db.sh pre-dan-93

            # Restart the services with the secrets from Doppler in the environment, where
            # docker compose fills in ${CLERK_SECRET_KEY}, ${DOMAIN} and the rest.
            # We first recreate the frontend and backend containers so they get their new IPs
            doppler run -- docker compose up -d --remove-orphans

            # Force recreating nginx-proxy to pick up the new configuration file inode
            # and to freshly resolve the new DNS IPs of the upstream containers
            doppler run -- docker compose up -d --force-recreate nginx-proxy

            # The stack's own Mongo container was removed as an orphan above. Its data was not
            # kept (Dang, 2026-10-25), so its volume goes too. No-op once it is gone.
            docker volume rm journei_mongodb_data 2>/dev/null || true

            # Clean up old unused images to prevent running out of disk space in future deployments
            docker image prune -a -f
