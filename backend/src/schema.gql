"A user from the shared core.users. `id` is the Clerk user id."
type User {
  id: ID!
  email: String!
  name: String!
  avatar: String
}

type Category {
  id: ID!
  name: String!
}

type Destination {
  id: ID!
  name: String!
}

type Plan {
  id: ID!
  title: String!
  startDate: String!
  endDate: String!
  destinations: [Destination!]!
  "Clerk user id of the owner."
  userId: ID!
  googleEventId: String
  "Whether the plan's activities are copied to the owner's Event Manager calendar."
  calendarSync: Boolean!
}

type Place {
  id: ID!
  name: String!
  planId: ID!
  destination: Destination!
  category: Category!
  priceRange: String
  reviewLinks: [String!]!
  notes: String
  visitStatus: String!
}

type ScheduledActivity {
  id: ID!
  place: Place!
  startTime: String!
  endTime: String!
  "The activity's event in Event Manager, or null when it is not on the calendar."
  calendarEvent: CalendarEventLink
  """
  The user's joined Event Manager events that overlap this activity, other than its own event.
  Empty when Event Manager cannot be reached.
  """
  calendarConflicts: [CalendarEvent!]!
}

"A reference to an event in another app of the ecosystem. Only the id is stored, never a copy."
type CalendarEventLink {
  app: String!
  id: ID!
  url: String!
}

"An event in the user's Event Manager calendar."
type CalendarEvent {
  id: ID!
  title: String!
  startTime: String!
  endTime: String!
  url: String!
}

type Query {
  hello: String!
  me: User

  categories: [Category!]!
  destinations: [Destination!]!

  myPlans: [Plan!]!
  plan(id: ID!): Plan

  placesForPlan(planId: ID!): [Place!]!
  recommendedPlaces(destinationId: ID!): [Place!]!

  scheduledActivitiesForPlan(planId: ID!): [ScheduledActivity!]!

  """
  The user's joined Event Manager events overlapping a time range, skipping the event of
  excludeActivityId (the activity being moved). Empty when Event Manager cannot be reached.
  """
  calendarConflicts(startTime: String!, endTime: String!, excludeActivityId: ID): [CalendarEvent!]!
}

type Mutation {
  createCategory(name: String!): Category!
  createDestination(name: String!): Destination!

  createPlan(
    title: String!
    startDate: String!
    endDate: String!
    destinationIds: [ID!]!
  ): Plan!

  updatePlan(
    id: ID!
    title: String
    startDate: String
    endDate: String
    destinationIds: [ID!]
  ): Plan!

  deletePlan(id: ID!): Boolean!

  """
  Turn copying the plan's activities to the Event Manager calendar on or off. Turning it on (again)
  creates or updates every activity's event; turning it off deletes them.
  """
  setPlanCalendarSync(planId: ID!, enabled: Boolean!): Plan!

  createPlace(
    name: String!
    planId: ID!
    destinationId: ID!
    categoryId: ID!
    priceRange: String
    reviewLinks: [String!]
    notes: String
  ): Place!

  updatePlace(
    id: ID!
    name: String
    categoryId: ID
    priceRange: String
    reviewLinks: [String!]
    notes: String
    visitStatus: String
  ): Place!

  deletePlace(id: ID!): Boolean!

  createScheduledActivity(
    placeId: ID!
    startTime: String!
    endTime: String!
  ): ScheduledActivity!

  updateScheduledActivity(
    id: ID!
    placeId: ID
    startTime: String
    endTime: String
  ): ScheduledActivity!

  deleteScheduledActivity(id: ID!): Boolean!
}
