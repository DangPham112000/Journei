# Fixed project name so container names do not depend on the directory the stack runs from.
name: journei

services:
  nginx-proxy:
    image: nginx:alpine
    container_name: journei-nginx-proxy
    ports:
      # Only reachable from the VPS itself. The host's nginx owns ports 80/443
      # and proxies journei.<domain> here, so other apps can share the server.
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 7

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_LOWER}/journei-frontend:latest
    container_name: journei-frontend
    # Note: We don't expose ports directly, Nginx proxy handles routing
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 7

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_LOWER}/journei-backend:latest
    container_name: journei-backend
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 7
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      # Shared MongoDB (ecosystem-infra, DAN-90): own Mongo user, own database.
      # MONGO_PASSWORD comes from Doppler journei/prd via `doppler run`.
      - MONGODB_URI=mongodb://journei:${MONGO_PASSWORD:?MONGO_PASSWORD is not set}@ecosystem-mongo:27017/journey-planner?authSource=admin
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      # Used to find Clerk's OAuth authorization server for the MCP endpoint.
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      # Origins allowed to use a Clerk session token (comma-separated).
      - CLERK_AUTHORIZED_PARTIES=https://${DOMAIN}
      - NODE_ENV=production
      - FRONTEND_URL=https://${DOMAIN}
    networks:
      - default
      - ecosystem

networks:
  # Created by the shared Mongo stack in ecosystem-infra; deploy that first.
  ecosystem:
    external: true
