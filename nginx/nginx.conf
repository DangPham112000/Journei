events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Increase proxy buffers to handle large files and prevent writing to temp files
    proxy_buffer_size   128k;
    proxy_buffers       4 256k;
    proxy_busy_buffers_size   256k;

    server {
        listen 80;
        # In production, replace this with your actual domain using sed or envsubst
        # Example: server_name journei.yourdomain.com;
        server_name _;

        # Route /graphql to the backend
        location /graphql {
            proxy_pass http://backend:4000/graphql;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # MCP server (users connect their own AI agent) and its OAuth discovery document
        location /mcp {
            proxy_pass http://backend:4000/mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location /.well-known/oauth-protected-resource {
            proxy_pass http://backend:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Route everything else to the frontend
        location / {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # Allow Google OAuth popup to communicate with the main window
            add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
        }
    }
}
